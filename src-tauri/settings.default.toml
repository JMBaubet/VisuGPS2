[Accueil.nbrCircuits.list]
description = "Nombre maximum de circuits présentés dans la liste."
documentation = """
Ce paramètre limite le nombre de circuits affichés dans la liste de la page
d'accueil. Seuls les circuits **visibles dans le viewport** de la carte (points
individuels et feuilles des clusters) sont pris en compte, puis triés par
proximité au centre de la carte. Le nombre affiché est plafonné à cette valeur.
"""
type = "int"
default = 6
min = 1
max = 20
step = 2

# --- Clés API (regroupées) ---
# Groupe système : les trois clés de licence de l'application (Mapbox +
# OpenRouteService) sont saisies au même endroit, dans le drawer de la vue
# Accueil. Les vues Audit et Édition masquent les sections système
# (`show-system=false`) : les clés ne s'y éditent pas, mais elles continuent
# d'y être lues par chemin (carte Mapbox, routage OpenRouteService).

[Systeme.Key.mapBox]
description = "Clé API MapBox"
documentation = """
Pour obtenir votre clé API veuillez vous rendre sur le site https://www.mapbox.com/ pour créer votre compte.
**Attention** : Bien que pour notre besoin l'utilisation est entièrement gratuite, une empreinte carte bleue est nécessaire à la création du compte.
"""
type = "secret"
default = ""
critical = true
icon = "mdi-account-key-outline"

[Systeme.Key.openRouteServiceClePrimaire]
description = "Clé API OpenRouteService n°1 (principale)"
documentation = """
Clé utilisée pour les demandes de routage (profil voiture et vélo de
route, deux requêtes parallèles). En cas de quota épuisé (HTTP 403 ou
429), bascule automatique sur la clé secondaire.

Format : chaîne de 40+ caractères fournie par OpenRouteService.
Chiffrée en AES-256-GCM avant écriture disque (clé maîtresse gérée
par le keyring OS en production).
"""
type = "secret"
default = ""
critical = true
icon = "mdi-account-key-outline"

[Systeme.Key.openRouteServiceCleSecondaire]
description = "Clé API OpenRouteService n°2 (secours)"
documentation = """
Clé utilisée en repli si la clé principale est refusée (403/429).
Si les deux clés sont refusées, le routage est impossible jusqu'à
la prochaine remise à zéro du quota (minuit UTC pour le plan gratuit).

Chiffrée en AES-256-GCM avant écriture disque.
"""
type = "secret"
default = ""
critical = true
icon = "mdi-account-key-outline"

[Affichage.moniteurs.principal]
description = "Écran pour la fenêtre principale"
documentation = """
Sélectionnez l'écran sur lequel s'ouvre la fenêtre principale de l'application.
Vous pouvez choisir un critère prédéfini :
- **origin** : écran principal (position 0,0)
- **other** : premier écran secondaire
- **builtin** : écran intégré (macOS) ou alias de origin sur Windows
- **external** : écran externe (macOS) ou alias de other sur Windows
ou sélectionner un nom d'écran spécifique parmi ceux détectés.
"""
type = "monitor"
default = "origin"
critical = false

[Affichage.moniteurs.secondaire]
description = "Écran pour la fenêtre secondaire"
documentation = """
Sélectionnez l'écran sur lequel s'ouvre la fenêtre secondaire (screen-bis).
Mêmes options que pour la fenêtre principale.
"""
type = "monitor"
default = "other"
critical = false

# ---------------------------------------------------------------------------
# Paramètres de la carte — favoris et affichage des traces.
# Toutes les couleurs affichées sur la carte Mapbox sont de type
# `material_extended` (palette Material Design, nuances 50 → 900), mais
# restent stockées au format #RRGGBBAA (validées comme `rgba` côté backend).
# ---------------------------------------------------------------------------

# --- Favoris ---

[Carte.Favoris.couleurCluster]
description = "Couleur des clusters contenant au moins un favori"
documentation = """
Couleur appliquée au cercle d'un cluster Mapbox dès qu'il contient
au moins une trace marquée comme favorite. Jaune Material (yellow 500).
"""
type = "material_extended"
default = "#FFEB3BFF"
icon = "mdi-map-marker-multiple-outline"

[Carte.Favoris.couleurTrace]
description = "Couleur de tracé des traces favorites"
documentation = """
Couleur utilisée pour dessiner la totalité de la LineString d'une trace
marquée comme favorite. Identique à la couleur du cluster favori par défaut.
"""
type = "material_extended"
default = "#FFEB3BFF"
icon = "mdi-map-marker-star"

[Carte.Favoris.epaisseur]
description = "Épaisseur des traces favorites (px)"
documentation = """
Épaisseur de ligne (en pixels) des traces favorites sur la carte.
"""
type = "int"
default = 6
min = 1
max = 20
step = 1
unit = "px"
icon = "mdi-format-line-weight"

# --- Clusters ---

[Carte.Clusters.seuilPopupCircuits]
description = "Seuil de circuits pour le popup de cluster"
documentation = """
Nombre maximum de circuits au-delà duquel un clic sur un cluster déclenche
le zoom d'expansion plutôt que l'affichage du popup listant les circuits.
Si un cluster contient un nombre de circuits inférieur ou égal à ce seuil,
un clic affiche un popup avec la liste des circuits (nom + icônes favori
et affichage). Au-delà du seuil, le cluster s'étend (zoom d'expansion).
"""
type = "int"
default = 10
min = 2
max = 20
step = 1

# --- Traces affichées (dégradé) ---

[Carte.Traces.couleurDebut]
description = "Couleur de début du dégradé"
documentation = "Couleur du tracé au point de départ de la trace. Bleu Material (blue 500)."
type = "material_extended"
default = "#2196F3FF"
icon = "mdi-gradient-horizontal"

[Carte.Traces.activerCouleurMilieu]
description = "Activer la couleur intermédiaire du dégradé"
documentation = """
Si activé, le dégradé passe par une couleur intermédiaire (mauve) à la
position définie par `positionCouleurMilieu`. Si désactivé, dégradé direct
début → fin.
"""
type = "bool"
default = true
icon = "mdi-toggle-switch-outline"

[Carte.Traces.couleurMilieu]
description = "Couleur intermédiaire du dégradé"
documentation = "Couleur intermédiaire (mauve) du dégradé. Violet Material (purple 500)."
type = "material_extended"
default = "#9C27B0FF"
icon = "mdi-palette"

[Carte.Traces.positionCouleurMilieu]
description = "Position de la couleur intermédiaire (%)"
documentation = """
Position de la couleur intermédiaire le long de la trace, exprimée en
pourcentage de la distance cumulée (0 = départ, 100 = arrivée).
"""
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05
icon = "mdi-percent"

[Carte.Traces.couleurFin]
description = "Couleur de fin du dégradé"
documentation = "Couleur du tracé au point d'arrivée de la trace. Rouge Material (red 500)."
type = "material_extended"
default = "#F44336FF"
icon = "mdi-gradient-vertical"

[Carte.Traces.epaisseur]
description = "Épaisseur des traces affichées (px)"
documentation = "Épaisseur de ligne (en pixels) des traces affichées sur la carte."
type = "int"
default = 4
min = 1
max = 20
step = 1
unit = "px"
icon = "mdi-format-line-weight"

[Carte.Traces.dureeFlyTo]
description = "Durée de l'animation flyTo du focus carte (ms)"
documentation = """
Durée en millisecondes de l'animation de déplacement de la carte lors du focus
sur un circuit (clic sur Info) et de son retour à la vue précédente.
"""
type = "int"
default = 500
min = 100
max = 2000
step = 100
unit = "ms"
icon = "mdi-timer-outline"

# --- Vue carte mémorisée (centrage / zoom) ---
# Paramètres **cachés** du drawer : le groupe `Carte.Vue` n'est listé dans
# aucune catégorie `_meta` — ils sont écrits automatiquement par la carte
# Accueil à chaque déplacement/zoom et lus à son montage pour restaurer la
# dernière vue (lancement ou retour sur la vue).

[Carte.Vue.centreLat]
description = "Latitude du centre de la carte (mémorisée)"
documentation = """
Latitude du centre de la carte de l'accueil, mémorisée automatiquement au
dernier déplacement/zoom de l'utilisateur et restituée au prochain affichage
de la vue (lancement ou retour depuis une autre vue).
"""
type = "float"
default = 43.7
min = -90.0
max = 90.0

[Carte.Vue.centreLng]
description = "Longitude du centre de la carte (mémorisée)"
documentation = """
Longitude du centre de la carte de l'accueil, mémorisée automatiquement au
dernier déplacement/zoom de l'utilisateur et restituée au prochain affichage
de la vue.
"""
type = "float"
default = 2.0
min = -180.0
max = 180.0

[Carte.Vue.zoom]
description = "Zoom de la carte (mémorisé)"
documentation = """
Zoom de la carte de l'accueil, mémorisé automatiquement au dernier
déplacement/zoom de l'utilisateur et restitué au prochain affichage de la vue.
"""
type = "float"
default = 5.15
min = 0.0
max = 22.0

# ---------------------------------------------------------------------------
# Paramètres de la vue d'édition caméra (route `editionCamera`).
# Accessibles via le bouton Paramètres (`mdi-cog-outline`) de la toolbar
# d'édition. L'algorithme et le gap min pilotent la génération des keyframes
# (fichiers persistés jamais régénérés sauf changement explicite) ; le zoom /
# pitch servent de valeurs par défaut aux nouveaux keyframes et au reset des
# sliders du CameraEditor ; les couleurs sont appliquées en direct sur la carte
# (trace + curseur d'avancement).
# ---------------------------------------------------------------------------

[Edition.Generation.algorithme]
description = "Algorithme de génération des keyframes"
documentation = """
Algorithme utilisé pour générer les points de RdV de la trace :
- **frustum** : placement récursif par visibilité (occlusion relief, cap lissé) ;
- **simple** : échantillonnage régulier (MVP).
Changer ce paramètre régénère les fichiers keyframes des deux ratios.
"""
type = "list"
default = "frustum"
choices = ["frustum", "simple"]
icon = "mdi-creation"

[Edition.Generation.gapMin]
description = "Distance minimale entre keyframes (m)"
documentation = """
Distance minimale entre deux points de RdV consécutifs, en mètres. L'algorithme
frustum l'utilise pour éviter la surabondance de keyframes.
"""
type = "int"
default = 1000
min = 200
max = 5000
step = 50
unit = "m"
icon = "mdi-format-line-spacing"

[Edition.Camera.zoomDefaut]
description = "Zoom par défaut de la caméra"
documentation = """
Zoom appliqué aux nouveaux keyframes (génération) et valeur de référence du
reset des sliders du CameraEditor. N'affecte pas les fichiers keyframes déjà
persistés.
"""
type = "float"
default = 16.0
min = 1.0
max = 22.0
step = 0.1
icon = "mdi-magnify-plus-outline"

[Edition.Camera.pitchDefaut]
description = "Pitch par défaut de la caméra (°)"
documentation = """
Inclinaison de la caméra appliquée aux nouveaux keyframes et valeur de
référence du reset des sliders du CameraEditor. 0 = vue verticale, 85 = quasi
horizontale.
"""
type = "int"
default = 60
min = 0
max = 85
step = 1
unit = "°"
icon = "mdi-rotate-3d"

[Edition.Camera.viewportDefaut]
description = "ViewPort sélectionné par défaut"
documentation = """
Ratio d'écran actif à l'ouverture de la vue d'édition. Le bouton ViewPort de la
toolbar permet toujours de basculer 16:9 / 4:3 pendant la session.
"""
type = "list"
default = "16:9"
choices = ["16:9", "4:3"]
icon = "mdi-monitor"

[Edition.Camera.dureeFlyTo]
description = "Durée du déplacement caméra vers le curseur (ms)"
documentation = """
Durée de l'animation de la caméra quand la position du curseur d'avancement
change (clic sur la timeline, navigation entre RdV, clic sur un virage) : la
caméra vole vers la nouvelle position au lieu d'y sauter instantanément.
"""
type = "int"
default = 250
min = 100
max = 1000
step = 50
unit = "ms"
icon = "mdi-timer-outline"

[Edition.Camera.afficherTelemetrie]
description = "Afficher le HUD de télémétrie"
documentation = """
Affiche l'overlay de télémétrie (coin supérieur droit) : paramètres caméra
(Zoom/Pitch/Bearing/Lng/Lat), altitude du traceur et relation caméra ↔ marqueur
(distance, cap relatif). Masqué par défaut.
"""
type = "bool"
default = false
icon = "mdi-information-outline"

[Edition.Camera.afficherCapBrutaux]
description = "Afficher le panneau des changements de cap brutaux"
documentation = """
Affiche **par défaut** le tableau des changements de cap brutaux (Départ /
Arrivée, Δ dist, Δ cap, Taux °/km) — comme le HUD de télémétrie, c'est un
paramètre d'affichage. Le bouton de la toolbar permet toujours de
l'afficher/masquer en cours de session.
"""
type = "bool"
default = false
icon = "mdi-rotate-3d-variant"

[Edition.Playback.acceleration]
description = "Accélération de la lecture (×)"
documentation = """
Facteur de vitesse appliqué à la lecture quand le mode **accéléré** est actif
(bouton double chevron à droite de Play/Pause). 1.5 = lecture 1,5× plus rapide,
2 = 2×, etc.
"""
type = "float"
default = 2.0
min = 1.5
max = 3.0
step = 0.5
icon = "mdi-play-speed"

[Edition.Couleurs.trace]
description = "Couleur de la trace"
documentation = """
Couleur de la LineString représentant la trace sur la carte satellite.
Rouge Material (red 500) par défaut.
"""
type = "material_extended"
default = "#F44336FF"
icon = "mdi-vector-line"

[Edition.Couleurs.curseur]
description = "Couleur du curseur d'avancement"
documentation = """
Couleur du curseur qui avance le long de la trace pendant la lecture : le
cercle sur la carte et le curseur de la timeline. Jaune Material (yellow A400)
par défaut.
"""
type = "material_extended"
default = "#FFD600FF"
icon = "mdi-play-circle-outline"

[Edition.Couleurs.epaisseurTrace]
description = "Épaisseur de la trace (px)"
documentation = """
Épaisseur de la LineString représentant la trace sur la carte satellite de
l'édition, en pixels. Appliquée en direct.
"""
type = "int"
default = 4
min = 1
max = 20
step = 1
unit = "px"
icon = "mdi-format-line-weight"

# ---------------------------------------------------------------------------
# AUDIT GPX — Paramètres d'analyse et de routage
# ---------------------------------------------------------------------------
#
# Ce namespace pilote le module Audit GPX : détection AR/RP et export. Il est
# consommé par le store Pinia `src/stores/audit.ts`, les commandes Tauri
# `gpx_audit::commands::*` et le drawer de la vue `/audit`.
#
# Les clés de licence ne vivent pas ici : celles de Mapbox et
# d'OpenRouteService sont regroupées dans le groupe système `Systeme.Key`
# (drawer de la vue Accueil) et lues par chemin — `useAuditOrs.ts` y lit les
# deux clés du routage.
# ---------------------------------------------------------------------------

# --- Consolidation ---

[Audit.Consolidation.seuil]
description = "Seuil de consolidation des points (m)"
documentation = """
Points consécutifs à moins de ce seuil sont fusionnés avant analyse.
0 désactive la consolidation (trace brute).

Un seuil plus élevé produit une trace plus lissée, éliminant les
micro-segments. Un seuil trop élevé peut masquer certaines anomalies
fines (notamment les paires miroir à faible distance).
"""
type = "float"
default = 0.5
min = 0.0
max = 5.0
step = 0.1
unit = "m"

# --- Détecteur AR (aller-retours) ---

[Audit.AR.toleranceDeg]
description = "Tolérance angulaire pour un retournement AR (°)"
documentation = """
Écart maximal au demi-tour parfait pour valider un retournement.
20° accepte les retournements approximatifs (bruit GPS courant),
0° n'accepte que les demi-tours quasi exacts (déconseillé en production,
sensible aux arrondis flottants).
"""
type = "float"
default = 20.0
min = 0.0
max = 90.0
step = 1.0
unit = "°"
icon = "mdi-angle-acute"

[Audit.AR.seuilPaireM]
description = "Seuil de distance pour une paire miroir (m)"
documentation = """
Distance maximale entre deux points symétriques autour d'un sommet
pour former une paire miroir.

Un seuil plus élevé détecte des paires plus larges (emprises AR plus
étendues). Un seuil trop faible ne retient que les superpositions
exactes. La valeur de 50 m couvre la majorité des cas réels.
"""
type = "float"
default = 50.0
min = 0.0
max = 500.0
step = 5.0
unit = "m"
icon = "mdi-arrow-expand-horizontal"

[Audit.AR.maxPaires]
description = "Nombre max de paires par sommet AR"
documentation = """
Budget maximal de paires symétriques testées autour d'un sommet.

Une valeur plus élevée étend l'emprise du finding (plus de points
inclus dans la zone d'anomalie). Une valeur plus faible réduit
l'emprise au voisinage immédiat du sommet.
"""
type = "int"
default = 5
min = 1
max = 10
step = 1
icon = "mdi-counter"

[Audit.AR.branchesMaxM]
description = "Longueur max des branches du sommet AR (m)"
documentation = """
Longueur maximale des deux branches (amont/aval) encadrant un sommet
AR. Sert de garde anti-« vrai virage en épingle » : un virage routier
normal a des branches > 200 m et ne doit pas être confondu avec un
retournement de traceur.

Une valeur plus élevée tolère des branches longues (risque de faux
positifs sur virages serrés). Une valeur plus faible exclut les
branches longues (risque de faux négatifs sur traces de traceur).
"""
type = "float"
default = 200.0
min = 10.0
max = 1000.0
step = 10.0
unit = "m"
icon = "mdi-source-branch"

# --- Détecteur RP (boucles giratoires) ---

[Audit.RP.seuilFermetureM]
description = "Seuil de refermeture des boucles RP (m)"
documentation = """
Distance maximale entre deux points non consécutifs pour créer une
paire candidate. Aussi utilisé par l'anti-aiguille (test miroir) et
pour la zone de superposition des ancres.

Attention : un seuil trop grand réhabilite les aiguilles larges (le
test miroir de l'anti-aiguille est calé sur ce seuil). Un seuil trop
petit empêche la détection des mini-giratoires (rayon < seuil).
"""
type = "float"
default = 15.0
min = 5.0
max = 60.0
step = 1.0
unit = "m"
icon = "mdi-vector-circle-variant"

[Audit.RP.angleMinDeg]
description = "Angle cumulé minimal pour valider une boucle RP (°)"
documentation = """
Angle cumulé minimal (après quantification) pour publier une fenêtre.
- 270° = « trois-quarts de tour et plus » (détecte les 3/4 de tour)
- 360° = tours complets et multiples uniquement (filtre strict)

La quantification aligne un tour complet sur exactement 360° quand la
mesure brute est dans la plage 320–400°, ce qui correspond à la
physique de la refermeture à l'angle vif.
"""
type = "int"
default = 270
min = 270
max = 360
step = 5
unit = "°"
icon = "mdi-rotate-360"

# --- Application (nom d'export) ---

[Audit.Application.nom]
description = "Nom d'application pour l'export GPX"
documentation = """
Nom inséré dans les métadonnées du GPX exporté (bloc audit) :
- élément <tool> du bloc <extensions><audit>
- élément <desc> du <metadata>
- attribut creator de la balise <gpx> (uniquement en cas de source
  sans attribut, cas pathologique)

Si vide, la valeur par défaut « VérificationGPX » est utilisée.
"""
type = "string"
default = "VérificationGPX"
icon = "mdi-application"

# ---------------------------------------------------------------------------
# MULTIRIDE — Détection des passages multiples
# ---------------------------------------------------------------------------
#
# Ce namespace pilote la détection des portions de trace parcourues plusieurs
# fois (aller-retour sur un tronçon, reconnaissance repassant sur une section,
# boucle locale). Il est consommé par le store Pinia `src/stores/multiride.ts`,
# les commandes Tauri `gpx_multiride::commands::*` et le drawer de la vue
# `/multiride`.
#
# La détection suit l'audit et précède l'édition caméra : tant que les passages
# détectés ne sont pas validés, l'édition caméra reste inaccessible
# (`multiride_status = "pending"` dans le registre des traces).
#
# Les quatre paramètres sont ceux de la spécification : ils portent l'essentiel
# du réglage de la détection, et leur documentation décrit l'effet d'un seuil
# trop bas ou trop haut (risques de faux positifs et de faux négatifs).
# ---------------------------------------------------------------------------

[Multiride.Detection.tolerance]
description = "Tolérance de superposition (m)"
documentation = """
Distance maximale entre deux points pour qu'ils soient considérés comme
« le même lieu géographique ». C'est le seuil central de la détection : il
décide que deux passages se superposent.

- **Trop bas** (< 5 m) : rate les portions répétées à cause du bruit GPS
  (5–15 m en zone ouverte, davantage en forêt).
- **Trop haut** (> 25 m) : mélange des voies parallèles distinctes (route et
  sentier adjacents, deux rues d'un même carrefour).

Conseil : 8–15 m selon la qualité de la trace.
"""
type = "int"
default = 10
min = 3
max = 30
step = 1
unit = "m"
icon = "mdi-crosshairs-gps"

[Multiride.Detection.longueurMin]
description = "Longueur minimale d'un segment (m)"
documentation = """
Longueur minimale d'une portion répétée pour être signalée. Filtre les
micro-correspondances parasites (demi-tour sur un parking, arrêt technique,
redémarrage GPS).

- **Trop bas** (< 30 m) : beaucoup de bruit dans les résultats.
- **Trop haut** (> 300 m) : peut rater des portions réellement répétées mais
  courtes (impasse, reconnaissance brève).

Conseil : 50–200 m selon le type de sortie.
"""
type = "int"
default = 100
min = 20
max = 500
step = 10
unit = "m"
icon = "mdi-ruler"

[Multiride.Detection.pasEchantillonnage]
description = "Pas d'échantillonnage (m)"
documentation = """
Granularité à laquelle la trace est rééchantillonnée avant détection. Un pas
constant rend les comparaisons d'intervalles homogènes, quelle que soit la
densité de points du GPX d'origine.

- **Trop bas** (< 3 m) : détection plus précise, mais coût de calcul et mémoire
  croissants.
- **Trop haut** (> 8 m) : plus rapide, mais peut manquer un chevauchement court
  ou imprécis (virages serrés).

Garde-fou : au-delà de 120 000 points échantillonnés, le pas est relevé
automatiquement et le fait est consigné dans le fichier de description
(`pas_plafonne`).
"""
type = "int"
default = 4
min = 2
max = 10
step = 1
unit = "m"
icon = "mdi-dots-grid"

[Multiride.Detection.fusionReferences]
description = "Fusion des références proches (m)"
documentation = """
Distance en deçà de laquelle deux passages voisins sont considérés comme un
seul passage logique. Recoud aussi les trous courts **à l'intérieur** d'un
passage (virages serrés, tunnels, pertes de correspondance), au double de
cette distance.

- **Trop bas** (< 20 m) : chaque micro-coupure (pause, arrêt photo,
  redémarrage GPS) fragmente les segments.
- **Trop haut** (> 300 m) : risque de coller des passages réellement
  différents.

Valeur 0 : désactive toute fusion automatique.

La frontière entre un aller et son retour n'est **jamais** franchie par cette
fusion, quel que soit le réglage : elle est tranchée par la géométrie locale
(inversion de cap, ré-emprunt de route), pas par ce seuil.
"""
type = "int"
default = 100
min = 0
max = 500
step = 5
unit = "m"
icon = "mdi-call-merge"

# ---------------------------------------------------------------------------
# ALTIMÉTRIE — Profil, segments de pente et montées
# ---------------------------------------------------------------------------
#
# Ce namespace pilote l'analyse altimétrique d'une trace propre. Le pipeline
# est porté du prototype validé (features/altimetrie/) et produit un unique
# fichier `traces/{trace_id}/altimetrie.json`, relu par la vue /altimetrie.
#
# La génération suit le nettoyage (import d'une trace propre ou validation
# d'audit). Enregistrer un paramètre ne relance pas la détection : la vue
# signale l'écart et propose un recalcul explicite.
# ---------------------------------------------------------------------------

[Altimetrie.Preparation.pasEchantillonnage]
description = "Pas de rééchantillonnage (m)"
documentation = """
Granularité de la grille altimétrique après moyennage. Un pas constant rend
les segments et les montées comparables, quelle que soit la densité du GPX.

- **Trop bas** (< 25 m) : calcul plus lourd, sans gain visible sur une trace
  GPS courante.
- **Trop haut** (> 100 m) : les montées courtes et les ruptures de pente
  s'effacent.

Valeur par défaut : 50 m.
"""
type = "int"
default = 50
min = 2
max = 200
step = 5
unit = "m"
icon = "mdi-dots-grid"

[Altimetrie.Preparation.correctionPlateaux]
description = "Correction des plateaux GPS (points)"
documentation = """
Les séries d'au moins N points à altitude constante (±1 m) sont remplacées par
une interpolation entre les points qui les encadrent. Corrige les plateaux
artificiels des GPS et des MNT.

- **0 ou 1** : correction désactivée.
- **Trop haut** (> 12 points) : des portions réellement plates peuvent être
  inclinées artificiellement.

Valeur par défaut : 6 points.
"""
type = "int"
default = 6
min = 0
max = 20
step = 1
unit = "points"
icon = "mdi-table-row-height"

[Altimetrie.Preparation.fenetreAntiPic]
description = "Fenêtre anti-pic (m)"
documentation = """
Fenêtre du filtre de Hampel qui remplace une altitude aberrante par la médiane
locale. La fenêtre est convertie en un nombre impair de points.

- **Trop petite** (< 2 × pas) : les pics isolés ne sont pas couverts.
- **Trop grande** (> 400 m) : les sommets réels sont adoucis.

Valeur par défaut : 200 m.
"""
type = "int"
default = 200
min = 50
max = 500
step = 25
unit = "m"
icon = "mdi-filter-variant"

[Altimetrie.Preparation.seuilAntiPic]
description = "Seuil anti-pic (m)"
documentation = """
Écart maximal à la médiane locale avant remplacement. Un point dont l'altitude
s'écarte de plus de ce seuil est corrigé.

Valeur 0 : filtre anti-pic désactivé.

Valeur par défaut : 15 m.
"""
type = "float"
default = 15
min = 0
max = 100
step = 5
unit = "m"
icon = "mdi-filter-remove-outline"

[Altimetrie.Lissage.fenetreAltitude]
description = "Fenêtre de lissage d'altitude (m)"
documentation = """
Fenêtre du Savitzky-Golay appliqué au profil affiché, avant ancrage aux bornes
des montées. C'est le réglage principal de la douceur du profil.

- **Trop petite** (< 5 × pas) : le profil reste bruité.
- **Trop grande** : les ruptures de pente et les sommets s'émoussent.

Valeur par défaut : 500 m.
"""
type = "int"
default = 500
min = 20
max = 5000
step = 25
unit = "m"
icon = "mdi-arrow-expand-horizontal"

[Altimetrie.Lissage.fenetrePente]
description = "Fenêtre de lissage de pente (m)"
documentation = """
Fenêtre de la moyenne mobile appliquée à la pente instantanée. Elle sert à la
détection des montées et au tracé, pas à la catégorisation des segments.

- **Trop petite** (< 3 × pas) : la détection réagit au bruit.
- **Trop grande** : les montées courtes sont lissées et peuvent disparaître.

Valeur par défaut : 150 m.
"""
type = "int"
default = 150
min = 10
max = 2000
step = 25
unit = "m"
icon = "mdi-chart-line"

[Altimetrie.Lissage.sigmaGaussien]
description = "Sigma du filtre gaussien (m)"
documentation = """
Second lissage appliqué après le Savitzky-Golay, avant l'ancrage. Il arrondit
les micro-reliefs sans déplacer les extrema ancrés.

Valeur 0 : filtre désactivé.

Valeur par défaut : 75 m.
"""
type = "float"
default = 75
min = 0
max = 500
step = 5
unit = "m"
icon = "mdi-chart-bell-curve"

[Altimetrie.Lissage.fenetreMediane]
description = "Filtre médian (m)"
documentation = """
Filtre médian optionnel appliqué avant la détection automatique, pour retirer
les pics isolés résistant à l'anti-pic.

Valeur 0 : filtre désactivé (défaut).
"""
type = "int"
default = 0
min = 0
max = 300
step = 5
unit = "m"
icon = "mdi-chart-bar"

[Altimetrie.Lissage.lissageRenforce]
description = "Lissage renforcé (double Savitzky-Golay)"
documentation = """
Ajoute un second passage Savitzky-Golay après l'ancrage aux bornes des
montées, puis restaure les altitudes exactes aux ancres. Produit un profil
plus lisse sans déplacer les vallées et sommets.

Désactivé : un seul passage, profil plus proche des altitudes brutes.
"""
type = "bool"
default = true
icon = "mdi-layers-outline"

[Altimetrie.Detection.seuilMontee]
description = "Seuil de détection des montées (%)"
documentation = """
Seuil d'hystérésis : une montée démarre quand la pente lissée dépasse +seuil
et se termine quand elle descend sous −seuil.

- **Trop bas** (< 0,3 %) : les faux plats montants deviennent des montées.
- **Trop haut** (> 2 %) : les montées douces sont ignorées.

Valeur par défaut : 0,5 %.
"""
type = "float"
default = 0.5
min = 0.1
max = 20
step = 0.1
unit = "%"
icon = "mdi-arrow-up-bold"

[Altimetrie.Detection.ecartFusion]
description = "Écart de fusion des montées (m)"
documentation = """
Deux montées séparées par moins que cet écart sont fusionnées en une seule
montée, avec leurs sous-montées conservées pour la séparation.

Valeur 0 : fusion automatique désactivée.

Valeur par défaut : 250 m.
"""
type = "int"
default = 250
min = 0
max = 5000
step = 50
unit = "m"
icon = "mdi-call-merge"

[Altimetrie.Detection.rechercheExtrema]
description = "Recherche des extrema (%)"
documentation = """
Rayon de recherche des vrais extrema autour d'une montée candidate, exprimé en
pourcentage de sa longueur. Borné par le pipeline entre 1 500 et 8 000 m.

Valeur par défaut : 60 %.
"""
type = "int"
default = 60
min = 1
max = 500
step = 5
unit = "%"
icon = "mdi-magnify"

[Altimetrie.Segments.fenetreCalcul]
description = "Fenêtre de calcul de pente (m)"
documentation = """
Largeur de la fenêtre centrée utilisée pour calculer la pente de coloration des
segments. La fenêtre effective peut atteindre le double de cette valeur.

- **Trop petite** (< 50 m) : la coloration scintille.
- **Trop grande** (> 300 m) : les changements de pente sont retardés.

Valeur par défaut : 100 m.
"""
type = "int"
default = 100
min = 50
max = 2000
step = 25
unit = "m"
icon = "mdi-arrow-expand-horizontal"

[Altimetrie.Segments.longueurMin]
description = "Longueur minimale d'un segment (m)"
documentation = """
Les segments de catégorie plus courts que cette longueur sont absorbés par le
voisin le plus long, puis les segments adjacents de même catégorie sont
réunis.

Valeur 0 : fusion des micro-segments désactivée.

Valeur par défaut : 200 m.
"""
type = "int"
default = 200
min = 0
max = 2000
step = 10
unit = "m"
icon = "mdi-ruler"

# ---------------------------------------------------------------------------
# Visualisation de la carte altimétrique.
# Ces réglages ne participent pas à l'analyse : ils s'appliquent immédiatement
# aux couches Mapbox et ne sont pas enregistrés dans `altimetrie.json`.
# ---------------------------------------------------------------------------

[Altimetrie.Visualisation.largeurTrace]
description = "Largeur du tracé coloré (px)"
documentation = """
Épaisseur, en pixels, des segments colorés par la pente sur la carte 3D.

Valeur par défaut : 5 px.
"""
type = "int"
default = 5
min = 2
max = 10
step = 1
unit = "px"
icon = "mdi-format-line-weight"

[Altimetrie.Visualisation.largeurTraceSelectionnee]
description = "Largeur du tracé sélectionné (px)"
documentation = """
Épaisseur, en pixels, du halo gris qui entoure la montée sélectionnée. Il est
tracé sous les segments colorés : pour rester visible, il doit être plus large
qu'eux.

Valeur par défaut : 8 px, pour un tracé coloré de 5 px.
"""
type = "int"
default = 8
min = 4
max = 12
step = 1
unit = "px"
icon = "mdi-format-line-weight"

[Altimetrie.Visualisation.couleurTraceSelectionnee]
description = "Couleur du tracé sélectionné"
documentation = """
Couleur du halo de la montée sélectionnée, tracé sous les segments colorés.
Bleu gris base (#607D8BFF) par défaut.
"""
type = "material_extended"
default = "#607D8BFF"
icon = "mdi-palette"

# ---------------------------------------------------------------------------
# Détection des tunnels (module Tunnels).
# Une trace propre est confrontée aux ways OSM `tunnel` + `highway` des PBF
# régionaux ; le résultat est écrit dans `traces/{trace_id}/tunnels.json` et
# l'état de validation dans `traces.json` (`tunnels_status`, `tunnels_count`).
# `regions.json` et les `.osm.pbf` vivent sur le support OSM, jamais dans le
# dossier de la trace.
# ---------------------------------------------------------------------------

[Tunnels.Detection.distanceTolerance]
description = "Tolérance de distance trace / segment OSM"
documentation = """
Distance maximale, en mètres, entre un point de la trace et un segment OSM pour
que le point soit considéré comme apparié. Valeur du prototype validé : **20 m**.
"""
type = "int"
default = 20
min = 5
max = 50
step = 1
unit = "m"
icon = "mdi-ruler"

[Tunnels.Detection.angleTolerance]
description = "Tolérance d'écart de cap"
documentation = """
Écart angulaire maximal, en degrés, entre le cap de la trace et celui du segment
OSM. La comparaison est **bidirectionnelle** : un tunnel parcouru dans l'autre
sens reste apparié. Valeur du prototype validé : **25°**.
"""
type = "int"
default = 25
min = 5
max = 90
step = 1
unit = "°"
icon = "mdi-compass-outline"

[Tunnels.Detection.bboxMargin]
description = "Marge de la bbox d'extraction OSM"
documentation = """
Marge, en mètres, ajoutée à la boîte englobante de la trace avant de sélectionner
les régions Geofabrik et de filtrer les ways. Valeur du prototype validé :
**500 m**.
"""
type = "int"
default = 500
min = 100
max = 5000
step = 100
unit = "m"
icon = "mdi-vector-square"

[Tunnels.Detection.bearingWindow]
description = "Fenêtre de calcul du cap"
documentation = """
Longueur, en mètres, de la fenêtre glissante utilisée pour calculer le cap de la
trace autour de chaque point. Une fenêtre trop courte est sensible au bruit GPS ;
trop longue, elle lisse les entrées de tunnel. Valeur du prototype : **30 m**.
"""
type = "int"
default = 30
min = 10
max = 100
step = 5
unit = "m"
icon = "mdi-arrow-expand-horizontal"

[Tunnels.Detection.minRunLength]
description = "Points consécutifs minimum par tunnel"
documentation = """
Nombre minimal de points consécutifs appariés à la même way OSM pour retenir un
tunnel. Un point isolé est le plus souvent un faux positif. Valeur du prototype :
**2 points**.
"""
type = "int"
default = 2
min = 1
max = 5
step = 1
unit = "pts"
icon = "mdi-counter"

[Tunnels.Detection.mergeGap]
description = "Écart maximal pour proposer une fusion"
documentation = """
Écart maximal, en mètres, entre la sortie d'un tunnel et l'entrée du suivant pour
que l'IHM propose de les fusionner. Ce réglage n'intervient pas dans la détection :
il pilote uniquement le bouton de fusion de l'onglet Tunnels. Les tronçons
fusionnés restent **disjoints** sur la carte et dans le profil.
"""
type = "int"
default = 100
min = 25
max = 250
step = 5
unit = "m"
icon = "mdi-call-merge"

[Tunnels.Support.dossierPbf]
description = "Dossier des données OSM"
documentation = """
Dossier du support externe (clé USB ou disque) qui contient `regions.json` et les
fichiers régionaux `.osm.pbf`. Les téléchargements Geofabrik sont silencieux :
`regions.json` est produit si nécessaire, puis les PBF requis par la trace sont
téléchargés avec affichage de la progression dans l'onglet Tunnels.

Les fichiers ne sont **jamais** copiés dans le dossier de la trace : seul
`tunnels.json` y est écrit.
"""
type = "directory"
default = ""
icon = "mdi-folder-open"

[Tunnels.Support.actif]
description = "Activer la détection des tunnels"
documentation = """
Active la préparation automatique des tunnels après nettoyage d'une trace. Quand
elle est désactivée, aucune détection ni téléchargement n'est lancé ; les tunnels
déjà présents restent consultables et éditables dans l'onglet Tunnels.
"""
type = "bool"
default = true
icon = "mdi-toggle-switch"

# ---------------------------------------------------------------------------
# Détection des communes traversées (module Communes).
# Une trace nettoyée est croisée avec les limites administratives communales
# d'OpenStreetMap ; le résultat est écrit dans `traces/{trace_id}/communes.json`
# et l'état de la fonctionnalité dans `traces.json` (`communes_completed`).
# Les réglages reprennent ceux du prototype validé (`features/communes/`).
# ---------------------------------------------------------------------------

[Communes.Detection.adminLevel]
description = "Niveau administratif OSM visé"
documentation = """
Valeur du tag OSM `admin_level` retenue comme « commune » :

- **8** en France, Espagne, Italie, Suisse (valeur par défaut) ;
- 6 pour un découpage départemental, 4 pour un découpage régional.

Les relations d'un autre niveau reçues dans la réponse sont ignorées : un
niveau erroné donne une détection **vide**, silencieuse.
"""
type = "string"
default = "8"
icon = "mdi-sitemap-outline"

[Communes.Detection.bboxBufferDeg]
description = "Élargissement de la zone de recherche (°)"
documentation = """
Marge ajoutée autour de la boîte englobante de la trace avant d'interroger
OpenStreetMap : **0.01°** ≈ 1 km.

- **Trop petite** (< 0.002°) : une commune traversée en bordure de trace peut
  manquer à l'appel, son polygone s'étendant au-delà de la zone interrogée.
- **Trop grande** (> 0.05°) : la réponse d'OpenStreetMap grossit (agglomérations
  denses), jusqu'au refus du serveur (HTTP 504).

La marge n'a aucune influence sur les kilomètres calculés : elle ne sert qu'à
la requête.
"""
type = "float"
default = 0.01
min = 0.001
max = 0.1
step = 0.001
unit = "°"
icon = "mdi-vector-square"

[Communes.Detection.simplifyTolerance]
description = "Tolérance de simplification de la trace (°)"
documentation = """
Tolérance du lissage Douglas-Peucker appliqué à la trace avant analyse :
**0.00005°** ≈ 5 m.

- **Plus fin** (< 0.00001°) : aucune précision gagnée, la frontière
  communale OSM étant elle-même précise à quelques mètres.
- **Plus grossier** (> 0.0002°) : la trace peut sortir d'une commune étroite
  (rue limitrophe), et la commune est perdue.

La simplification ne sert qu'aux calculs internes : les kilomètres sont
ensuite raffinés par intersection avec les frontières réelles.
"""
type = "float"
default = 0.00005
min = 0.000001
max = 0.001
step = 0.000001
unit = "°"
icon = "mdi-vector-polyline"

[Communes.Detection.targetSamples]
description = "Nombre cible d'échantillons"
documentation = """
Nombre de points échantillonnés le long de la trace pour établir la commune
traversée à chaque position : **2000** par défaut.

Le pas effectif est `longueur / targetSamples`, jamais inférieur à
`minSampleStepKm`. Sur les traces longues, c'est ce plafond qui évite que le
nombre de tests d'appartenance explose.
"""
type = "int"
default = 2000
min = 100
max = 20000
step = 100
icon = "mdi-dots-grid"

[Communes.Detection.minSampleStepKm]
description = "Pas minimal d'échantillonnage (km)"
documentation = """
Distance minimale entre deux échantillons : **0.1 km** (100 m).

C'est le pas réel sur les traces courtes et moyennes. Un pas plus fin
(< 0.05 km) n'améliore pas la précision des points d'entrée et de sortie —
ceux-ci sont raffinés par intersection avec la frontière — mais multiplie les
tests.
"""
type = "float"
default = 0.1
min = 0.01
max = 2.0
step = 0.01
unit = "km"
icon = "mdi-ruler"

[Communes.Detection.maxAreaRatio]
description = "Exclusion des polygones aberrants (× médiane)"
documentation = """
Un multipolygone OSM cassé a une surface démesurée qui englobe ses voisines et
fausse la traversée : toute commune dont la surface dépasse ce facteur fois la
**médiane** des candidates est écartée avant l'analyse fine.

- **10** (défaut) : élimine les polygones manifestement cassés sans risquer
  d'écarter une grande commune légitime (une agglomération est déjà ~10× sa
  voisine rurale).
- **Trop bas** (< 3) : une grande commune voisine de petites communes est
  écartée à tort.

Sécurité : si le filtre emportait **toutes** les candidates, il est annulé —
mieux vaut une commune aberrante qu'une trace sans aucune commune.
"""
type = "float"
default = 10.0
min = 1.0
max = 100.0
step = 1.0
unit = "×"
icon = "mdi-arrow-expand-horizontal"

[Communes.Detection.minSegmentKm]
description = "Longueur minimale d'un passage (km)"
documentation = """
Tout passage plus court est ignoré : **0.015 km** (15 m). Ces micro-passages
proviennent d'imprécisions de simplification ou de polygones OSM imparfaits, et
non d'une traversée réelle.

Valeur 0 : conserve tout, y compris les artefacts.
"""
type = "float"
default = 0.015
min = 0.0
max = 0.5
step = 0.005
unit = "km"
icon = "mdi-filter-remove-outline"

[Communes.Detection.minKeepKm]
description = "Absorption des passages courts (km)"
documentation = """
Un passage plus court est absorbé par son **voisin le plus long** — la surface
absorbée lui est réattribuée, la couverture de la trace reste complète :
**0.5 km** (500 m).

- **0.5** (défaut) : un passage de quelques centaines de mètres ne correspond
  qu'à un artefact (frontière OSM imprécise, micro-chevauchement) et brouille
  la lecture.
- **Trop haut** (> 2 km) : une commune légitimement traversée sur 1 km
  disparaîtrait du résultat.

Valeur 0 : aucune absorption. Ce seuil est plus permissif que `minSegmentKm` :
il s'applique une fois les passages identifiés.
"""
type = "float"
default = 0.5
min = 0.0
max = 5.0
step = 0.1
unit = "km"
icon = "mdi-call-merge"

[Communes.Overpass.delaiSec]
description = "Délai d'attente par miroir Overpass (s)"
documentation = """
Délai accordé à **chaque** miroir Overpass avant de passer au suivant :
**60 s**.

Les miroirs sont essayés en cascade : ce délai est donc le temps d'attente
maximal par miroir, et une détection peut coûter jusqu'à quatre fois ce délai
avant d'échouer. Un échec n'est pas silencieux — la trace reste à détecter et
est reprise au lancement suivant.

- **Trop court** (< 40 s) : un serveur chargé est abandonné alors qu'il allait
  répondre. L'API publique rend régulièrement sa réponse en 30 à 90 s sur une
  zone dense.
- **Trop long** (> 180 s) : la tâche de fond s'enlise sur un miroir mort.

Le client patiente 5 s de plus que ce délai, pour que ce soit l'erreur du
serveur (plus informative) qui clôt la tentative.
"""
type = "int"
default = 60
min = 30
max = 300
step = 10
unit = "s"
icon = "mdi-timer-sand"

# ---------------------------------------------------------------------------
# Paramètres d'exemple — illustrent chaque type pris en charge par ParameterCard.
# Ils servent de démonstration / de tests et peuvent être supprimés une fois
# les vrais paramètres branchés.
# ---------------------------------------------------------------------------

[Exemples.bool]
description = "Mode sombre (exemple booléen)"
documentation = """
Active ou désactive le mode sombre de l'interface.
- Activé : les couleurs de fond sont assombries.
- Désactivé : le thème clair est utilisé.
"""
type = "bool"
default = false

[Exemples.float]
description = "Délai de rafraîchissement (exemple décimal)"
documentation = """
Intervalle de temps entre deux rafraîchissements automatiques de la carte.
Plus la valeur est faible, plus la carte est réactive, mais plus la charge
processeur augmente.
"""
type = "float"
default = 0.5
min = 0.1
max = 5.0
step = 0.1
unit = "s"

[Exemples.int]
description = "Nombre d'éléments en cache (exemple entier)"
documentation = """
Nombre maximum d'éléments conservés en cache mémoire.
Valeur strictement positive.
"""
type = "int"
default = 30
min = 0
max = 500
step = 10
unit = "éléments"

[Exemples.secret]
description = "Jeton d'authentification (exemple secret)"
documentation = """
Valeur masquée et chiffrée sur disque (AES-256-GCM).
Laissez vide pour désactiver l'authentification.
"""
type = "secret"
default = ""
critical = true

[Exemples.list]
description = "Niveau de détail des logs (exemple liste)"
documentation = """
Choix contraint parmi les niveaux de sévérité standards.
Les niveaux supérieurs incluent les niveaux inférieurs.
"""
type = "list"
default = "info"
choices = ["error", "warning", "info", "debug", "trace"]

[Exemples.rgba]
description = "Couleur de trace (exemple RGBA)"
documentation = """
Couleur utilisée pour dessiner la trace GPS sur la carte.
Le canal alpha règle la transparence (FF = opaque, 00 = invisible).
"""
type = "rgba"
default = "#FF5722FF"

[Exemples.materialPrimary]
description = "Couleur d'accentuation (exemple Material primaire)"
documentation = """
Couleur principale d'accentuation issue de la palette Material Design de base.
Seules les couleurs de base sont sélectionnables.
"""
type = "material_primary"
default = "#3F51B5FF"

[Exemples.materialExtended]
description = "Couleur de surbrillance (exemple Material étendu)"
documentation = """
Couleur de surbrillon issue de la palette Material Design étendue
(nuances 50 à 900 par teinte). Seules ces couleurs sont sélectionnables,
afin de garantir le respect de la charte.
"""
type = "material_extended"
default = "#5C6BC0FF"

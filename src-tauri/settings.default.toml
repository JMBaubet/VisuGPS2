# Paramètres applicatifs.
# Schéma (aligné sur la spec EN) :
#   type          = "int" | "float" | "bool" | "secret" | "list" | "rgba"
#                  | "material_primary" | "material_extended" | "monitor"
#   description   = libellé court affiché en en-tête de carte
#   documentation = texte Markdown rendu dans la carte (anciennement "doc")
#   default       = valeur par défaut
#   min/max/step  = optionnels, numériques (acceptent entiers et décimaux)
#   unit          = optionnel, unité affichée (ex: "ms", "s")
#   choices       = optionnel, tableau de chaînes (type "list" contraint)
#   critical      = optionnel (booléen, anciennement "critique")
#   icon          = optionnel, nom d'icône MDI pour le drawer (défaut = icône par type)

# ===========================================================================
# Organisation des paramètres pour le drawer (table spéciale `_meta`).
# Toutes les sous-tables de `_meta` DOIVENT être contiguës et placées avant
# les tables de paramètres (convention TOML). Cette table est exclue du
# « flatten » des paramètres : elle n'est lue que par `get_settings_meta`.
# ===========================================================================

# --- Paramètres système (communs à toutes les vues) ---
# Les groupes sont les catégories effectivement affichées en section système.
[_meta.system]
groups = ["Systeme.Key", "Affichage.moniteurs"]

# Entrées d'action non-paramètres affichées en tête de la section système.
[_meta.system.actions.modes]
label = "Modes d'exécution"
icon = "mdi-database-cog-outline"
action = "openModes"

# Groupes utilisant un handler spécial au lieu de ParameterCard individuel.
[_meta.system.handlers]
"Affichage.moniteurs" = "monitors"

# --- Vues applicatives (chacune expose ses propres catégories) ---
# La clé de chaque vue correspond au `name` d'une route Vue Router
# (cf. src/router/index.ts). Seules les catégories listées s'affichent
# lorsque la vue est active (en plus des catégories système ci-dessus).
#
# État actuel du router : accueil (contient la carte Map), visualisation
# et editionCamera (stubs), screenBis (fenêtre secondaire). Les paramètres
# de la carte vivent donc dans la vue `accueil`. Quand de nouvelles vues
# auront leurs propres paramètres, ajoutez une entrée [_meta.views.<route>].

[_meta.views.accueil]
label = "Accueil"
icon = "mdi-home"
groups = ["Accueil", "Carte.Favoris", "Carte.Traces", "Carte.Clusters", "Exemples"]

# Vue d'édition / montage (Mode 2). Ses paramètres (EditionCamera.*) sont
# délibérément NON référencés dans `groups` : ils sont rendus par un composant
# dédié (EditionSettingsPanel.vue) et non par le SettingsDrawer générique.
# Le drawer n'affiche donc que les catégories système sur cette vue.
[_meta.views.editionCamera]
label = "Édition caméra"
icon = "mdi-video-vintage"
groups = []

# --- Métadonnées d'affichage des catégories (libellé / icône) ---
# Optionnel : à défaut, le libellé est le dernier segment du path du groupe.
[_meta.groups."Systeme.Key"]
label = "Licences"
icon = "mdi-key-chain"

[_meta.groups.Accueil]
label = "Accueil — Circuits"
icon = "mdi-map-legend"

[_meta.groups."Affichage.moniteurs"]
label = "Configuration des fenêtres"
icon = "mdi-projector"

[_meta.groups."Carte.Favoris"]
label = "Carte — Favoris"
icon = "mdi-star"

[_meta.groups."Carte.Traces"]
label = "Carte — Traces affichées"
icon = "mdi-gradient-horizontal"

[_meta.groups."Carte.Clusters"]
label = "Carte — Clusters"
icon = "mdi-format-list-numbered"

[Accueil.nbrCircuits.list]
description = "Nombre maximum de circuits présentés dans la liste."
documentation = """
Ce paramètre limite le nombre de circuits affichés dans la liste de la page
d'accueil. Seuls les circuits **visibles dans le viewport** de la carte (points
individuels et feuilles des clusters) sont pris en compte, puis triés par
proximité au centre de la carte. Le nombre affiché est plafonné à cette valeur.
"""
type = "int"
default = 6
min = 1
max = 20
step = 2

[Systeme.Key.mapBox]
description = "Clé API MapBox"
documentation = """
Pour obtenir votre clé API veuillez vous rendre sur le site https://www.mapbox.com/ pour créer votre compte.
**Attention** : Bien que pour notre besoin l'utilisation est entièrement gratuite, une empreinte carte bleue est nécessaire à la création du compte.
"""
type = "secret"
default = ""
critical = true

[Affichage.moniteurs.principal]
description = "Écran pour la fenêtre principale"
documentation = """
Sélectionnez l'écran sur lequel s'ouvre la fenêtre principale de l'application.
Vous pouvez choisir un critère prédéfini :
- **origin** : écran principal (position 0,0)
- **other** : premier écran secondaire
- **builtin** : écran intégré (macOS) ou alias de origin sur Windows
- **external** : écran externe (macOS) ou alias de other sur Windows
ou sélectionner un nom d'écran spécifique parmi ceux détectés.
"""
type = "monitor"
default = "origin"
critical = false

[Affichage.moniteurs.secondaire]
description = "Écran pour la fenêtre secondaire"
documentation = """
Sélectionnez l'écran sur lequel s'ouvre la fenêtre secondaire (screen-bis).
Mêmes options que pour la fenêtre principale.
"""
type = "monitor"
default = "other"
critical = false

# ---------------------------------------------------------------------------
# Paramètres de la carte — favoris et affichage des traces.
# Toutes les couleurs affichées sur la carte Mapbox sont de type
# `material_extended` (palette Material Design, nuances 50 → 900), mais
# restent stockées au format #RRGGBBAA (validées comme `rgba` côté backend).
# ---------------------------------------------------------------------------

# --- Favoris ---

[Carte.Favoris.couleurCluster]
description = "Couleur des clusters contenant au moins un favori"
documentation = """
Couleur appliquée au cercle d'un cluster Mapbox dès qu'il contient
au moins une trace marquée comme favorite. Jaune Material (yellow 500).
"""
type = "material_extended"
default = "#FFEB3BFF"
icon = "mdi-map-marker-multiple-outline"

[Carte.Favoris.couleurTrace]
description = "Couleur de tracé des traces favorites"
documentation = """
Couleur utilisée pour dessiner la totalité de la LineString d'une trace
marquée comme favorite. Identique à la couleur du cluster favori par défaut.
"""
type = "material_extended"
default = "#FFEB3BFF"
icon = "mdi-map-marker-star"

[Carte.Favoris.epaisseur]
description = "Épaisseur des traces favorites (px)"
documentation = """
Épaisseur de ligne (en pixels) des traces favorites sur la carte.
"""
type = "int"
default = 6
min = 1
max = 20
step = 1
unit = "px"
icon = "mdi-format-line-weight"

# --- Clusters ---

[Carte.Clusters.seuilPopupCircuits]
description = "Seuil de circuits pour le popup de cluster"
documentation = """
Nombre maximum de circuits au-delà duquel un clic sur un cluster déclenche
le zoom d'expansion plutôt que l'affichage du popup listant les circuits.
Si un cluster contient un nombre de circuits inférieur ou égal à ce seuil,
un clic affiche un popup avec la liste des circuits (nom + icônes favori
et affichage). Au-delà du seuil, le cluster s'étend (zoom d'expansion).
"""
type = "int"
default = 10
min = 2
max = 20
step = 1

# --- Traces affichées (dégradé) ---

[Carte.Traces.couleurDebut]
description = "Couleur de début du dégradé"
documentation = "Couleur du tracé au point de départ de la trace. Bleu Material (blue 500)."
type = "material_extended"
default = "#2196F3FF"
icon = "mdi-gradient-horizontal"

[Carte.Traces.activerCouleurMilieu]
description = "Activer la couleur intermédiaire du dégradé"
documentation = """
Si activé, le dégradé passe par une couleur intermédiaire (mauve) à la
position définie par `positionCouleurMilieu`. Si désactivé, dégradé direct
début → fin.
"""
type = "bool"
default = true
icon = "mdi-toggle-switch-outline"

[Carte.Traces.couleurMilieu]
description = "Couleur intermédiaire du dégradé"
documentation = "Couleur intermédiaire (mauve) du dégradé. Violet Material (purple 500)."
type = "material_extended"
default = "#9C27B0FF"
icon = "mdi-palette"

[Carte.Traces.positionCouleurMilieu]
description = "Position de la couleur intermédiaire (%)"
documentation = """
Position de la couleur intermédiaire le long de la trace, exprimée en
pourcentage de la distance cumulée (0 = départ, 100 = arrivée).
"""
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05
icon = "mdi-percent"

[Carte.Traces.couleurFin]
description = "Couleur de fin du dégradé"
documentation = "Couleur du tracé au point d'arrivée de la trace. Rouge Material (red 500)."
type = "material_extended"
default = "#F44336FF"
icon = "mdi-gradient-vertical"

[Carte.Traces.epaisseur]
description = "Épaisseur des traces affichées (px)"
documentation = "Épaisseur de ligne (en pixels) des traces affichées sur la carte."
type = "int"
default = 4
min = 1
max = 20
step = 1
unit = "px"
icon = "mdi-format-line-weight"

[Carte.Traces.dureeFlyTo]
description = "Durée de l'animation flyTo du focus carte (ms)"
documentation = """
Durée en millisecondes de l'animation de déplacement de la carte lors du focus
sur un circuit (clic sur Info) et de son retour à la vue précédente.
"""
type = "int"
default = 500
min = 100
max = 2000
step = 100
unit = "ms"
icon = "mdi-timer-outline"

# ---------------------------------------------------------------------------
# Paramètres d'exemple — illustrent chaque type pris en charge par ParameterCard.
# Ils servent de démonstration / de tests et peuvent être supprimés une fois
# les vrais paramètres branchés.
# ---------------------------------------------------------------------------

[Exemples.bool]
description = "Mode sombre (exemple booléen)"
documentation = """
Active ou désactive le mode sombre de l'interface.
- Activé : les couleurs de fond sont assombries.
- Désactivé : le thème clair est utilisé.
"""
type = "bool"
default = false

[Exemples.float]
description = "Délai de rafraîchissement (exemple décimal)"
documentation = """
Intervalle de temps entre deux rafraîchissements automatiques de la carte.
Plus la valeur est faible, plus la carte est réactive, mais plus la charge
processeur augmente.
"""
type = "float"
default = 0.5
min = 0.1
max = 5.0
step = 0.1
unit = "s"

[Exemples.int]
description = "Nombre d'éléments en cache (exemple entier)"
documentation = """
Nombre maximum d'éléments conservés en cache mémoire.
Valeur strictement positive.
"""
type = "int"
default = 30
min = 0
max = 500
step = 10
unit = "éléments"

[Exemples.secret]
description = "Jeton d'authentification (exemple secret)"
documentation = """
Valeur masquée et chiffrée sur disque (AES-256-GCM).
Laissez vide pour désactiver l'authentification.
"""
type = "secret"
default = ""
critical = true

[Exemples.list]
description = "Niveau de détail des logs (exemple liste)"
documentation = """
Choix contraint parmi les niveaux de sévérité standards.
Les niveaux supérieurs incluent les niveaux inférieurs.
"""
type = "list"
default = "info"
choices = ["error", "warning", "info", "debug", "trace"]

[Exemples.rgba]
description = "Couleur de trace (exemple RGBA)"
documentation = """
Couleur utilisée pour dessiner la trace GPS sur la carte.
Le canal alpha règle la transparence (FF = opaque, 00 = invisible).
"""
type = "rgba"
default = "#FF5722FF"

[Exemples.materialPrimary]
description = "Couleur d'accentuation (exemple Material primaire)"
documentation = """
Couleur principale d'accentuation issue de la palette Material Design de base.
Seules les couleurs de base sont sélectionnables.
"""
type = "material_primary"
default = "#3F51B5FF"

[Exemples.materialExtended]
description = "Couleur de surbrillance (exemple Material étendu)"
documentation = """
Couleur de surbrillon issue de la palette Material Design étendue
(nuances 50 à 900 par teinte). Seules ces couleurs sont sélectionnables,
afin de garantir le respect de la charte.
"""
type = "material_extended"
default = "#5C6BC0FF"

# ===========================================================================
# Paramètres de l'atelier d'édition caméra (Mode 2) et du pré-calcul (Mode 1).
#
# Ces paramètres pilotent l'algorithme de zone morte, l'échantillonnage des
# keyframes, le traceur et la résolution canonique de pré-calcul. Ils sont
# rendus par le composant dédié EditionSettingsPanel.vue (vue editionCamera),
# et délibérément absents du SettingsDrawer générique (non listés dans
# [_meta.views.editionCamera].groups). Ils bénéficient néanmoins de la
# persistance et de l'isolation par mode d'exécution du système de settings.
# ===========================================================================

# --- Résolution canonique de pré-calcul ---
# Le pré-calcul force la map à ces dimensions via map.resize(), afin que les
# calculs de zone morte (map.project() → pixels) soient indépendants de
# l'écran réel. À la lecture, jumpTo reproduit le même cadrage géographique
# sur tout écran (vidéoprojecteur inclus) : un écran plus large révèle plus
# de contexte périphérique sans décaler le traceur.

[EditionCamera.Viewport.largeurReference]
description = "Largeur du viewport de référence (px)"
documentation = """
Largeur (en pixels) du viewport canonique utilisé lors du pré-calcul.
Tous les calculs de zone morte se font dans ce repère fixe, indépendamment
de l'écran réel. 1920 par défaut (Full HD). Ne pas modifier sans raison.
"""
type = "int"
default = 1920
min = 640
max = 3840
step = 16
unit = "px"
icon = "mdi-resize"

[EditionCamera.Viewport.hauteurReference]
description = "Hauteur du viewport de référence (px)"
documentation = """
Hauteur (en pixels) du viewport canonique utilisé lors du pré-calcul.
1080 par défaut (Full HD). Ne pas modifier sans raison.
"""
type = "int"
default = 1080
min = 360
max = 2160
step = 16
unit = "px"
icon = "mdi-resize"

# --- Échantillonnage (pré-calcul) ---

[EditionCamera.PreCalcul.sampleRate]
description = "Fréquence d'échantillonnage des keyframes (ms)"
documentation = """
Intervalle de temps (en millisecondes) entre deux keyframes dans le fichier
brut. Plus la valeur est faible, plus l'animation est fluide mais plus le
fichier est gros. 100 ms (10 fps) donne un bon compromis pour 2–5 Mo sur
un trajet de 2 h.
"""
type = "int"
default = 100
min = 50
max = 500
step = 50
unit = "ms"
icon = "mdi-timer-outline"

# --- Caméra par défaut ---

[EditionCamera.Cam.defaultZoom]
description = "Zoom initial et de base"
documentation = """
Niveau de zoom Mapbox initial et servant de base aux calculs d'altitude
(cf. zoomAltitudeFactor). 16 par défaut.
"""
type = "float"
default = 16.0
min = 8.0
max = 20.0
step = 0.5
icon = "mdi-magnify-plus-outline"

[EditionCamera.Cam.defaultPitch]
description = "Pitch (inclinaison) initial (°)"
documentation = """
Inclinaison initiale de la caméra en degrés (0 = nadir, 85 = quasi horizontale).
60° par défaut (effet drone).
"""
type = "float"
default = 60.0
min = 0.0
max = 85.0
step = 1.0
unit = "°"
icon = "mdi-axis-x-arrow"

[EditionCamera.Cam.defaultBearing]
description = "Cap initial (°)"
documentation = "Cap initial de la caméra par rapport au Nord. 0° par défaut."
type = "float"
default = 0.0
min = 0.0
max = 360.0
step = 1.0
unit = "°"
icon = "mdi-compass"

# --- Zone morte (Dead Zone) ---
# Tant que le traceur reste dans une zone centrale de l'écran, la caméra
# reste immobile. Dès qu'il s'en approche des bords, un flyTo de rattrapage
# est déclenché.

[EditionCamera.ZoneMorte.deadZoneX]
description = "Zone morte horizontale (fraction de la largeur)"
documentation = """
Fraction de la largeur du viewport (0 → 1) définissant la zone centrale
horizontale dans laquelle le traceur peut se déplacer sans déclencher de
rattrapage caméra. 0.30 = 30 % de la largeur.
"""
type = "float"
default = 0.30
min = 0.0
max = 0.49
step = 0.05
icon = "mdi-arrow-expand-horizontal"

[EditionCamera.ZoneMorte.deadZoneY]
description = "Zone morte verticale (fraction de la hauteur)"
documentation = """
Fraction de la hauteur du viewport (0 → 1) définissant la zone centrale
verticale dans laquelle le traceur peut se déplacer sans déclencher de
rattrapage caméra. 0.30 = 30 % de la hauteur.
"""
type = "float"
default = 0.30
min = 0.0
max = 0.49
step = 0.05
icon = "mdi-arrow-expand-vertical"

[EditionCamera.ZoneMorte.anticipationTime]
description = "Anticipation du bearing (s)"
documentation = """
Temps d'anticipation (en secondes) pour le calcul du cap : la caméra regarde
vers la position du traceur un peu plus loin que sa position courante, afin
 d'anticiper les virages. 1.5 s par défaut.
"""
type = "float"
default = 1.5
min = 0.0
max = 5.0
step = 0.1
unit = "s"
icon = "mdi-eye-arrow-right-outline"

[EditionCamera.ZoneMorte.bearingSmoothThreshold]
description = "Seuil de lissage du bearing (°)"
documentation = """
Écart angulaire (en degrés) en dessous duquel le cap n'est pas recalculé,
afin d'éviter les micro-oscillations sur les lignes droites. 15° par défaut.
"""
type = "float"
default = 15.0
min = 0.0
max = 90.0
step = 1.0
unit = "°"
icon = "mdi-compass-outline"

# --- Vols (FlyTo) lors du pré-calcul ---

[EditionCamera.FlyTo.minFlyDuration]
description = "Durée minimale d'un vol (ms)"
documentation = """
Durée minimale (en millisecondes) d'un flyTo de rattrapage, pour éviter les
à-coups trop brefs entre deux positions de caméra. 800 ms par défaut.
"""
type = "int"
default = 800
min = 100
max = 5000
step = 100
unit = "ms"
icon = "mdi-timer-sand"

[EditionCamera.FlyTo.maxFlyDuration]
description = "Durée maximale d'un vol (ms)"
documentation = """
Durée maximale (en millisecondes) d'un flyTo de rattrapage, pour éviter les
transitions trop lentes. 12 000 ms (12 s) par défaut.
"""
type = "int"
default = 12000
min = 1000
max = 60000
step = 1000
unit = "ms"
icon = "mdi-timer-sand-complete"

[EditionCamera.FlyTo.speedFactor]
description = "Vitesse de base de l'animation (ms/m)"
documentation = """
Temps (en millisecondes) pour parcourir 1 mètre à l'écran. 4 ms/m équivaut
à 4000 ms/km (soit 4 s par km). Piloté par défaut par cette constante lors
du calcul des durées de flyTo.
"""
type = "float"
default = 4.0
min = 1.0
max = 20.0
step = 0.5
unit = "ms/m"
icon = "mdi-speedometer"

[EditionCamera.FlyTo.zoomAltitudeFactor]
description = "Facteur d'ajustement du zoom par altitude"
documentation = """
Facteur appliqué au zoom par tranche de 1000 m d'altitude, afin d'éviter que
la caméra ne traverse le relief sur les terrains escarpés. Par défaut :
zoom = defaultZoom + (altitude / 1000) × 0.5.
"""
type = "float"
default = 0.5
min = 0.0
max = 2.0
step = 0.1
icon = "mdi-elevation-rise"

# --- Traceur (marqueur de progression) ---

[EditionCamera.Traceur.markerColor]
description = "Couleur du marqueur traceur"
documentation = """
Couleur du marqueur représentant le traceur (point). Rouge vif par défaut
pour contraster avec le relief.
"""
type = "rgba"
default = "#FF0000FF"
icon = "mdi-circle"

[EditionCamera.Traceur.markerSize]
description = "Taille du marqueur traceur (px)"
documentation = "Taille (en pixels) du marqueur traceur s'il est de type Point. 12 px par défaut."
type = "int"
default = 12
min = 4
max = 40
step = 1
unit = "px"
icon = "mdi-circle-medium"

[EditionCamera.Traceur.markerAltitudeOffset]
description = "Décalage vertical du marqueur (m)"
documentation = """
Décalage vertical (en mètres) appliqué au marqueur pour le faire flotter
au-dessus du sol et améliorer la lisibilité sur les terrains accidentés.
2 m par défaut.
"""
type = "float"
default = 2.0
min = 0.0
max = 20.0
step = 0.5
unit = "m"
icon = "mdi-arrow-up"

[EditionCamera.Traceur.showTrail]
description = "Afficher la trace déjà parcourue"
documentation = """
Si activé, la portion déjà parcourue de la trace est dessinée dynamiquement
jusqu'à la position courante du curseur. Recommandé pour l'effet immersif.
"""
type = "bool"
default = true
icon = "mdi-map-marker-distance"

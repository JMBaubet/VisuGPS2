[_meta.groups."Carte.Favoris"]
label = "Carte — Favoris"
icon = "mdi-star"

[_meta.groups."Carte.Traces"]
label = "Carte — Traces affichées"
icon = "mdi-gradient-horizontal"

[_meta.groups."Carte.Clusters"]

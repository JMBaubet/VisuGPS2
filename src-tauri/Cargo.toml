[package]
name = "visugps2"
version = "0.0.1"
description = "Visualisation 3D d'une trace gpx"
authors = ["Jean-Marc BAUBET"]
edition = "2024" # Mis à jour vers 2024 par le script update-metadata.js

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
time = "0.3"
dotenvy = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["fs", "io-util", "rt", "net", "time"] }
# Module d'import GPX
gpx = "0.10"
geo = "0.29"
osmpbfreader = "0.19"
rstar = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
regex = "1"
# Espace disponible sur le support OSM (clé USB).
fs4 = "1.1"
# Lecture de l'en-tête PBF (date de génération) : mêmes versions que
# `osmpbfreader`, utilisées directement pour parser `HeaderBlock` et `Blob`.
flate2 = "1"
protobuf = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
tokio = { version = "1", features = ["time"] }

